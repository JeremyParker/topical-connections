# One entry per topic. Each topic has its own database, whose URL comes from
# the environment variable named in database_url_env.
#
# The slug in [brackets] is part of its API URLs: /api/<slug>/...
#
# origins: browser origins allowed to call the API for this topic

[music]
name = "FourFour"
topical_label = "is a musical category"
email_from = "FourFour <login@example.com>" # TODO: set once we have a domain
database_url_env = "DATABASE_URL_MUSIC"
origins = ["http://localhost:5173"]
